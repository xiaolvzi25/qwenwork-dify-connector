<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>连接 Dify</title><style nonce="__CSRF__">body{font:17px system-ui;background:#f5f7fa;color:#182638;margin:8vh auto;padding:28px;max-width:720px}main{background:white;padding:32px;border-radius:16px}input{box-sizing:border-box;width:100%;padding:14px;font-size:16px;margin:12px 0}button,a{display:inline-block;padding:12px 20px;border:0;border-radius:8px;background:#2563eb;color:white;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}#code{font-size:32px;letter-spacing:5px}small{color:#52647a}pre{white-space:pre-wrap}input[type=checkbox]{width:auto;margin:0 8px 0 0}#sharing{margin:8px 0 16px}</style>
<main><h1>连接 Dify 企业版</h1><p>填写企业 Dify 控制台地址。凭据由本机官方 difyctl 保存。请由本人在 Dify 授权页面批准访问。</p><label>Dify 访问链接<input id="server" type="url" required></label><section id="sharing"><label><input id="share" type="checkbox">使用本机 difyctl 的登录</label><input id="configdir" type="text" placeholder="本机 difyctl 配置目录" hidden><small id="found" hidden></small></section><button id="start">连接并获取鉴权码</button><p id="message"></p><section id="verify" hidden><p>请在 Dify 页面输入下方鉴权码并由你本人批准：</p><p id="code"></p><a id="link" target="_blank" rel="noopener noreferrer">打开 Dify 授权页面</a><p>完成后返回本页，状态将自动更新。</p></section><pre id="who"></pre><button id="close">关闭连接向导</button><p><small>本向导仅监听本机回环地址。连接器页面的“已连接”由客户端下一次状态检查同步。</small></p></main>
<script nonce="__CSRF__">const base='__BASE__',csrf='__CSRF__';
const el=id=>document.getElementById(id);
const SOURCES={env:'来自 DIFY_CONFIG_DIR',shell:'来自终端设置',default:'未读到终端设置，使用默认位置',manual:'手动填写'};
const ERRORS={invalid_server:'地址无效，请填写 HTTPS Dify 控制台地址。',invalid_config_dir:'本机 difyctl 配置目录无效，请填写绝对路径。',already_started:'连接已在进行中。',shared_server_mismatch:'本机 difyctl 已登录到其他地址（或非 HTTPS 地址）。请填写与它相同的地址，或取消“使用本机 difyctl 的登录”。'};
function showFound(login,source){let text=login?'该目录已登录：'+login+'。共用后在任一处退出都会同时退出。':'该目录没有已保存的登录，连接后终端 difyctl 也会使用这个登录。';el('found').textContent=source?SOURCES[source]+'。'+text:text}
async function detect(dir){el('found').textContent='正在查找本机 difyctl…';let r=await fetch(base+'/detect'+(dir?'?dir='+encodeURIComponent(dir):''));let d=await r.json();if(!r.ok){el('found').textContent=ERRORS[d.error]||'无法读取该目录。';return}el('configdir').value=d.shared_config_dir;showFound(d.shared_login,d.source)}
function showSharing(){let on=el('share').checked;el('configdir').hidden=!on;el('found').hidden=!on;if(on&&!el('configdir').value)detect('')}
el('share').onchange=showSharing;el('configdir').onchange=()=>detect(el('configdir').value);
let initialized=false;async function refresh(){try{let r=await fetch(base+'/state');if(!r.ok)throw Error();
let s=await r.json();if(!initialized){el('server').value=s.server||'';el('share').checked=s.share_login;el('configdir').value=s.shared_config_dir||'';if(s.share_login)showFound(s.shared_login,'');showSharing();initialized=true}el('message').textContent=s.message;el('server').disabled=s.stage!=='setup';el('share').disabled=s.stage!=='setup';el('configdir').disabled=s.stage!=='setup';el('start').disabled=s.stage!=='setup';if(s.stage==='pending'){el('verify').hidden=false;el('code').textContent=s.user_code;el('link').href=s.verification_uri}if(s.stage==='authorized'){el('verify').hidden=true;el('who').textContent=JSON.stringify(s.identity,null,2);clearInterval(timer)}}catch(e){el('message').textContent='连接向导已关闭或超时，请返回千问办公查看状态。';clearInterval(timer)}}el('start').onclick=async()=>{let r=await fetch(base+'/start',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':csrf},body:JSON.stringify({server:el('server').value,share_login:el('share').checked,shared_config_dir:el('configdir').value})});if(!r.ok){let d=await r.json().catch(()=>({}));el('message').textContent=ERRORS[d.error]||'请求失败，请重试。'}else refresh()};
el('close').onclick=async()=>{await fetch(base+'/close',{method:'POST',headers:{'X-CSRF':csrf}});el('message').textContent='向导已关闭，可以关闭此标签页。';clearInterval(timer)};
const timer=setInterval(refresh,1500);refresh();</script></html>

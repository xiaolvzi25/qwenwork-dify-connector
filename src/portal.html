<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>连接 Dify</title><style nonce="__CSRF__">body{font:17px system-ui;background:#f5f7fa;color:#182638;margin:8vh auto;padding:28px;max-width:720px}main{background:white;padding:32px;border-radius:16px}input{box-sizing:border-box;width:100%;padding:14px;font-size:16px;margin:12px 0}button,a{display:inline-block;padding:12px 20px;border:0;border-radius:8px;background:#2563eb;color:white;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}#code{font-size:32px;letter-spacing:5px}small{color:#52647a}pre{white-space:pre-wrap}</style>
<main><h1>连接 Dify 企业版</h1><p>填写企业 Dify 控制台地址。凭据由本机官方 difyctl 保存。请由本人在 Dify 授权页面批准访问。</p><label>Dify 访问链接<input id="server" type="url" required></label><button id="start">连接并获取鉴权码</button><p id="message"></p><section id="verify" hidden><p>请在 Dify 页面输入下方鉴权码并由你本人批准：</p><p id="code"></p><a id="link" target="_blank" rel="noopener noreferrer">打开 Dify 授权页面</a><p>完成后返回本页，状态将自动更新。</p></section><pre id="who"></pre><button id="close">关闭连接向导</button><p><small>本向导仅监听本机回环地址。连接器页面的“已连接”由客户端下一次状态检查同步。</small></p></main>
<script nonce="__CSRF__">const base='__BASE__',csrf='__CSRF__';
const el=id=>document.getElementById(id);
let initialized=false;async function refresh(){try{let r=await fetch(base+'/state');if(!r.ok)throw Error();
let s=await r.json();if(!initialized){el('server').value=s.server||'';initialized=true}el('message').textContent=s.message;el('server').disabled=s.stage!=='setup';el('start').disabled=s.stage!=='setup';if(s.stage==='pending'){el('verify').hidden=false;el('code').textContent=s.user_code;el('link').href=s.verification_uri}if(s.stage==='authorized'){el('verify').hidden=true;el('who').textContent=JSON.stringify(s.identity,null,2);clearInterval(timer)}}catch(e){el('message').textContent='连接向导已关闭或超时，请返回千问办公查看状态。';clearInterval(timer)}}el('start').onclick=async()=>{let r=await fetch(base+'/start',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':csrf},body:JSON.stringify({server:el('server').value})});if(!r.ok)el('message').textContent='地址无效或请求失败，请检查 HTTPS 地址。';else refresh()};
el('close').onclick=async()=>{await fetch(base+'/close',{method:'POST',headers:{'X-CSRF':csrf}});el('message').textContent='向导已关闭，可以关闭此标签页。';clearInterval(timer)};
const timer=setInterval(refresh,1500);refresh();</script></html>

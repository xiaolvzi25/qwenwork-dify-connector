name: Desktop native validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux_amd64
            python: python3
          - runner: windows-latest
            target: windows_amd64
            python: python
          # Native ARM64 and Intel labels verified in GitHub's official table:
          # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - runner: ubuntu-24.04-arm
            target: linux_arm64
            python: python3
          - runner: macos-15-intel
            target: darwin_amd64
            python: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      # Official tag refs resolved through GitHub API on 2026-11-12:
      # https://api.github.com/repos/actions/checkout/git/ref/tags/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://api.github.com/repos/actions/setup-go/git/ref/tags/v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build, native regressions, and pinned official CLI smoke
        run: ${{ matrix.python }} tests/ci_native.py --go go --output native-test-reports
        env:
          PYTHONUTF8: '1'
      # https://api.github.com/repos/actions/upload-artifact/git/ref/tags/v7.0.2
      - name: Upload native reports and binary hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: |
            native-test-reports/
            dist/BUILD-RECORD.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
